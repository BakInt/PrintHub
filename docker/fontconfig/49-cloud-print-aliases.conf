<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  云打印系统字体映射与回退配置。

  作用：把文档里常见的“字体名”（尤其是 Windows/Office 专有字体名，容器里不存在）
  映射到镜像内已安装的等价字体，避免 LibreOffice 转 PDF 时 fallback 到缺字字体，
  从而消除中文、化学式下标、数学/特殊符号、图案符号打印乱码或方框问题。

  说明：
  - <family> 是文档请求的字体名；<accept>/<prefer> 是实际使用的字体。
  - CJK 中文优先 Noto Sans/Serif CJK SC；符号类兜底 Noto Sans Symbols/Symbols2/Math。
  - 该文件放在 /etc/fonts/conf.d/ 下，对全系统（含 LibreOffice、Poppler）生效。
-->
<fontconfig>

  <!-- ============ 全局兜底回退链 ============ -->
  <!-- 任何字体最终都追加这些兜底字体，保证 CJK、数学符号、化学符号、图案符号有字形 -->
  <match target="pattern">
    <test name="family" qual="any">
      <string>sans-serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans CJK SC</string>
      <string>Noto Sans</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>Noto Sans Math</string>
      <string>Noto Color Emoji</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>serif</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Serif CJK SC</string>
      <string>Noto Serif</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Serif</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="family" qual="any">
      <string>monospace</string>
    </test>
    <edit name="family" mode="append" binding="weak">
      <string>Noto Sans Mono CJK SC</string>
      <string>DejaVu Sans Mono</string>
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Symbols2</string>
      <string>Noto Sans Math</string>
    </edit>
  </match>

  <!-- ============ 中文宋体系 → Noto Serif CJK SC ============ -->
  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>宋体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>NSimSun</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>新宋体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>FangSong</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>仿宋</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- ============ 中文黑体/雅黑系 → Noto Sans CJK SC ============ -->
  <match target="pattern">
    <test name="family"><string>SimHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>黑体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Microsoft JhengHei</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK TC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DengXian</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>等线</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>

  <!-- ============ 中文楷体 → Noto Serif CJK SC（无楷体时的最接近替代）============ -->
  <match target="pattern">
    <test name="family"><string>KaiTi</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>楷体</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>楷体_GB2312</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- ============ 常见西文字体名 → Liberation/DejaVu 等度量兼容字体 ============ -->
  <match target="pattern">
    <test name="family"><string>Times New Roman</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Courier New</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Liberation Mono</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Calibri</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cambria</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Caladea</string></edit>
  </match>

  <!-- ============ 符号/图案字体 → Noto Symbols 系列 ============ -->
  <!-- Wingdings / Webdings / Symbol 等 Windows 图案字体，容器里没有，
       映射到 Noto Sans Symbols2（覆盖大量图案/装饰符号），避免整段变方框 -->
  <match target="pattern">
    <test name="family"><string>Wingdings</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols2</string>
      <string>Noto Sans Symbols</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Wingdings 2</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols2</string>
      <string>Noto Sans Symbols</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Wingdings 3</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols2</string>
      <string>Noto Sans Symbols</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Webdings</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols2</string>
      <string>Noto Sans Symbols</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Symbol</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Symbols</string>
      <string>Noto Sans Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cambria Math</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Math</string>
      <string>STIX Two Math</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

</fontconfig>
